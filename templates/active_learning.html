<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeToon - Active Learning Dashboard</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { color: #38bdf8; margin: 0; }
        .stats-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            backdrop-filter: blur(10px);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #fbbf24; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 600px;
            position: relative;
        }

        .image-viewer {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background: #0f172a;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #334155;
            margin-bottom: 20px;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .info-panel {
            width: 100%;
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        .info-box {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            width: 40%;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-safe { background: #10b981; color: white; }
        .btn-violence { background: #ef4444; color: white; }
        .btn-erotism { background: #a855f7; color: white; }
        .btn-delete { background: #334155; color: #94a3b8; grid-column: span 3; }
        
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mini-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .log-list {
            height: 300px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .log-item { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid #334155; }
        
        #scanBtn {
            background: #38bdf8;
            color: #0f172a;
            width: 100%;
            margin-bottom: 10px;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 20px;
            z-index: 100;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Active Learning Review</h1>
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Remaining</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correctedCount">0</div>
                <div class="stat-label">Corrected</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="main-card">
            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <p id="loadingText">Scanning Dataset...</p>
            </div>

            <div class="image-viewer">
                <img id="currentImage" src="" alt="Frame to review">
            </div>

            <div class="info-panel">
                <div class="info-box">
                    <div class="stat-label">Current Folder</div>
                    <div class="stat-value" id="currentFolder">?</div>
                </div>
                <div class="info-box">
                    <div class="stat-label">Model Predicts</div>
                    <div class="stat-value" id="modelPredicts" style="color: #fb7185">?</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-safe" onclick="updateLabel('safe')">Keep as Safe</button>
                <button class="btn btn-violence" onclick="updateLabel('violence')">Keep as Violence</button>
                <button class="btn btn-erotism" onclick="updateLabel('erotism')">Keep as Erotism</button>
                <button class="btn btn-delete" onclick="deleteImage()">Delete Corrupt/Bad Data</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="mini-card">
                <button id="scanBtn" class="btn" onclick="scanDataset()">Scan for Confusion</button>
                <p style="font-size: 0.75rem; color: #64748b; margin: 0;">This scans the MEGA dataset for images where the model disagrees with the folder label or is low confidence.</p>
            </div>

            <div class="mini-card">
                <h3>Recent Actions</h3>
                <div id="logList" class="log-list">
                    <div class="log-item">Ready to scan...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFrames = [];
        let currentIndex = 0;
        let correctedCount = 0;

        async function scanDataset() {
            showLoading("Scanning ~24,000 images... Please wait.");
            try {
                const response = await fetch('/get_confusing_frames');
                const data = await response.json();
                currentFrames = data.frames;
                currentIndex = 0;
                document.getElementById('totalCount').innerText = currentFrames.length;
                
                if (currentFrames.length > 0) {
                    displayFrame();
                    addLog(`Found ${currentFrames.length} confusing frames.`);
                } else {
                    alert("No confusing frames found! Your model is very confident.");
                    addLog("Scan complete: No confusion found.");
                }
            } catch (e) {
                alert("Error scanning dataset: " + e.message);
            } finally {
                hideLoading();
            }
        }

        function displayFrame() {
            if (currentIndex >= currentFrames.length) {
                document.getElementById('currentImage').src = "";
                document.getElementById('currentFolder').innerText = "DONE";
                document.getElementById('modelPredicts').innerText = "DONE";
                alert("All confusing frames reviewed!");
                return;
            }

            const frame = currentFrames[currentIndex];
            // Flask serves MEGA folder at /dataset_images/
            document.getElementById('currentImage').src = `/dataset_images/${frame.rel_path}?t=${Date.now()}`;
            document.getElementById('currentFolder').innerText = frame.current_label.toUpperCase();
            document.getElementById('modelPredicts').innerText = `${frame.predicted.toUpperCase()} (${Math.round(frame.confidence * 100)}%)`;
            document.getElementById('totalCount').innerText = currentFrames.length - currentIndex;
        }

        async function updateLabel(newLabel) {
            if (currentIndex >= currentFrames.length) return;
            
            const frame = currentFrames[currentIndex];
            try {
                const response = await fetch('/update_label', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        path: frame.abs_path,
                        new_label: newLabel
                    })
                });
                const result = await response.json();
                if (result.success) {
                    addLog(`Moved ${frame.rel_path.split('/').pop()} to ${newLabel}`);
                    correctedCount++;
                    document.getElementById('correctedCount').innerText = correctedCount;
                    currentIndex++;
                    displayFrame();
                }
            } catch (e) {
                alert("Error updating label: " + e.message);
            }
        }

        async function deleteImage() {
            if (!confirm("Are you sure you want to delete this image?")) return;
            if (currentIndex >= currentFrames.length) return;
            
            const frame = currentFrames[currentIndex];
            try {
                const response = await fetch('/delete_image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path: frame.abs_path })
                });
                const result = await response.json();
                if (result.success) {
                    addLog(`Deleted ${frame.rel_path.split('/').pop()}`);
                    currentIndex++;
                    displayFrame();
                }
            } catch (e) {
                alert("Error deleting image: " + e.message);
            }
        }

        function addLog(msg) {
            const list = document.getElementById('logList');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            list.prepend(item);
        }

        function showLoading(text) {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loadingText').innerText = text;
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
