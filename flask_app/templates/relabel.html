<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confusion Relabel Tool | SafeToon AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #6366f1;
            --safe: #10b981;
            --erotism: #f43f5e;
            --violence: #f59e0b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        header {
            grid-column: 1 / -1;
            padding: 1rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .stats-bar span b {
            color: var(--accent);
        }

        /* --- Image Card --- */
        .viewport-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #current-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Control Panel --- */
        .controls-card {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 20px;
        }

        .info-panel h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }

        .metric .label { color: var(--text-dim); font-weight: 300; }
        .metric .value { font-weight: 600; }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(255,255,255,0.1);
        }

        .status-mismatch { color: #f43f5e; background: rgba(244, 63, 94, 0.1); }
        .status-confusing { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .status-confident { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .status-live { color: #c084fc; background: rgba(192, 132, 252, 0.1); }

        .mode-toggle {
            display: flex;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .mode-btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .btn {
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .btn:active { transform: scale(0.97); }

        .btn-safe { background: var(--safe); color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); }
        .btn-erotism { background: var(--erotism); color: white; box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4); }
        .btn-violence { background: var(--violence); color: white; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4); }
        .btn-skip { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }

        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .progress-mini {
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 1rem;
        }

        #progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SafeToon Relabel Tool</h1>
            <div class="mode-toggle">
                <button class="mode-btn active" id="btn-mode-hard" onclick="setMode('hard')">Hard Samples</button>
                <button class="mode-btn" id="btn-mode-confident" onclick="setMode('confident')">High Confidence</button>
                <button class="mode-btn" id="btn-mode-web" onclick="setMode('web')">🌐 Live Web Test</button>
            </div>
            <div class="stats-bar">
                <span>Processed: <b id="stat-processed">0</b></span>
                <span id="label-found">Hard Found:</span> <b id="stat-found">0</b></span>
                <span id="scan-status">Scanning...</span>
            </div>
        </header>

        <main class="viewport-card">
            <div id="loader" class="loading-overlay">
                <div class="spinner"></div>
                <p id="loader-text">Finding next sample...</p>
            </div>
            <img id="current-img" src="" alt="Sample Image">
        </main>

        <aside class="controls-card">
            <div class="info-panel">
                <h3>Prediction Stats</h3>
                <div class="metric">
                    <span class="label">Original Folder</span>
                    <span class="value" id="val-true-label">-</span>
                </div>
                <div class="metric">
                    <span class="label">Model Pred</span>
                    <span class="value" id="val-pred-label" style="color: var(--accent)">-</span>
                </div>
                <div class="metric">
                    <span class="label">Confidence</span>
                    <span class="value" id="val-conf">-</span>
                </div>
                <div class="metric">
                    <span class="label">Margin</span>
                    <span class="value" id="val-margin">-</span>
                </div>
                <div id="badge-container"></div>
            </div>

            <div class="info-panel">
                <h3>Set Correct Label</h3>
                <div class="action-grid">
                    <button class="btn btn-safe" onclick="relabel('safe')">Safe</button>
                    <button class="btn btn-erotism" onclick="relabel('erotism')">Erotism</button>
                    <button class="btn btn-violence" onclick="relabel('violence')">Violence</button>
                    <button class="btn btn-skip" onclick="fetchNext()">Skip / Next</button>
                </div>
                <div class="progress-mini">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        let currentSample = null;

        async function fetchNext() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch('/next');
                const data = await res.json();
                
                // Update Stats
                document.getElementById('stat-processed').innerText = data.stats.processed;
                document.getElementById('stat-found').innerText = data.stats.found;
                document.getElementById('scan-status').innerText = data.stats.scanning ? "Scanning..." : "Scan Complete";

                if (data.success) {
                    currentSample = data.sample;
                    updateUI(data.sample);
                    document.getElementById('loader').style.display = 'none';
                } else {
                    setTimeout(fetchNext, 3000); // Retry soon
                }
            } catch (e) {
                console.error(e);
                setTimeout(fetchNext, 5000);
            }
        }

        function updateUI(sample) {
            const img = document.getElementById('current-img');
            img.src = '/images/' + encodeURIComponent(sample.path);
            
            document.getElementById('val-true-label').innerText = sample.true_label;
            document.getElementById('val-pred-label').innerText = sample.pred_label;
            document.getElementById('val-conf').innerText = sample.confidence + '%';
            document.getElementById('val-margin').innerText = sample.margin;

            const badgeContainer = document.getElementById('badge-container');
            let badgeClass = 'status-confusing';
            if (sample.status === 'MISMATCH') badgeClass = 'status-mismatch';
            if (sample.status === 'CONFIDENT') badgeClass = 'status-confident';
            if (sample.status === 'LIVE TEST') badgeClass = 'status-live';
            
            badgeContainer.innerHTML = `<span class="status-badge ${badgeClass}">${sample.status}</span>`;
        }

        async function setMode(mode) {
            const res = await fetch('/set_mode', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mode: mode })
            });
            const data = await res.json();
            if (data.success) {
                // Update button styles
                document.getElementById('btn-mode-hard').classList.toggle('active', mode === 'hard');
                document.getElementById('btn-mode-confident').classList.toggle('active', mode === 'confident');
                document.getElementById('btn-mode-web').classList.toggle('active', mode === 'web');
                
                const labelFound = document.getElementById('label-found');
                if (mode === 'hard') labelFound.innerText = "Hard Found:";
                else if (mode === 'confident') labelFound.innerText = "Confident Found:";
                else labelFound.innerText = "Web Tests:";
                
                document.getElementById('loader-text').innerText = mode === 'web' ? "Fetching from internet..." : "Finding next sample...";
                
                // Clear UI and restart fetch
                currentSample = null;
                document.getElementById('current-img').src = '';
                fetchNext();
            }
        }

        async function relabel(newLabel) {
            if (!currentSample) return;

            const res = await fetch('/relabel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    path: currentSample.path,
                    new_label: newLabel
                })
            });
            const data = await res.json();
            if (data.success) {
                fetchNext();
            } else {
                alert('Move failed: ' + data.error);
            }
        }

        // Initial fetch
        fetchNext();
    </script>
</body>
</html>
